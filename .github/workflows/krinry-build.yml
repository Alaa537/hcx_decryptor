name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - profile
          - release

      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - apk-split

      target_platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android-arm64
          - android-arm
          - android-x64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Create Android project
        run: flutter create --platforms android .

      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if 'ndkVersion' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    ndkVersion "28.2.13676358"',
                  1
              )

          p.write_text(s)
          print("Android NDK configured: 28.2.13676358")
          PY

      - name: Configure Gradle
        shell: bash
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.11.1-all.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          PLAT="${{ github.event.inputs.target_platform }}"

          if [ "$OUT" = "apk" ]; then
            if [ "$PLAT" != "all" ]; then
              flutter build apk --$TYPE --target-platform $PLAT
            else
              flutter build apk --$TYPE
            fi

          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi

          elif [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE
          fi

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
